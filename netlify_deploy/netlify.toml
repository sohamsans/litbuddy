[build]
  publish = "dist"

# Netlify API proxy to cloud backend
# Replace the 'to' URL with your deployed backend URL (Render, Railway, Fly.io, etc.)
[[redirects]]
  from = "/api/*"
  to = "https://litbuddy-backend.onrender.com/api/:splat"
  status = 200
  force = false

# Single Page Application routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
