[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Netlify API proxy to cloud backend
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-api.onrender.com/api/:splat"
  status = 200
  force = false

# Single Page Application routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
